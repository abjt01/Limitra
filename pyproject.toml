[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "abjt-limitter"
dynamic = ["version"]
description = "A modern Python library for rate limiting algorithms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "abjt01" },
]
keywords = [
    "rate-limiting",
    "rate-limiter",
    "token-bucket",
    "leaky-bucket",
    "sliding-window",
    "fixed-window",
    "throttle",
    "throttling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/abjt01/Limitra"
Documentation = "https://github.com/abjt01/Limitra#readme"
Repository = "https://github.com/abjt01/Limitra"
Issues = "https://github.com/abjt01/Limitra/issues"
Changelog = "https://github.com/abjt01/Limitra/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    # Pinned exactly: a formatter that floats will reformat the tree
    # out from under CI on its next release.
    "ruff==0.16.8",
]

[tool.setuptools.dynamic]
version = { attr = "limitra.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
limitra = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 88
# Prose, not source: leave the README's aligned comments alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "TC001",  # runtime-used imports must not move into a type-checking block
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["limitra"]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks are wall-clock sensitive; run them with `pytest -m benchmark -s`.
addopts = "-v --tb=short -m 'not benchmark'"
markers = [
    "benchmark: throughput and scaling measurements, deselected by default",
]
